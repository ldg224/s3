<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Awards | HCL S3</title>
  <meta name="theme-color" content="#0f1115">
  <link rel="icon" type="image/png" href="assets/league/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .awards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; }
    .award { display: grid; gap: 14px; align-content: start; }
    .award::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--gold); }
    .award-head { display: flex; align-items: center; gap: 12px; }
    .award-icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--gold-solid); background: rgba(251,191,36,.1); border: 1px solid rgba(251,191,36,.3); }
    .award-icon svg { width: 22px; height: 22px; }
    .award h2 { margin: 0; font-size: 1.05rem; font-weight: 800; line-height: 1.2; }
    .award .sub { font-size: .75rem; color: var(--muted); font-weight: 600; }
    .winner { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--r-md); background: linear-gradient(135deg, rgba(251,191,36,.1), rgba(255,255,255,.02)); border: 1px solid rgba(251,191,36,.22); }
    .winner .who { font-size: 1.15rem; font-weight: 800; line-height: 1.2; }
    .winner .team { font-size: .78rem; color: var(--muted); font-weight: 600; }
    .winner .val { margin-left: auto; text-align: right; flex: none; }
    .winner .val b { display: block; font-size: 1.6rem; font-weight: 800; line-height: 1; color: var(--gold-solid); font-variant-numeric: tabular-nums; }
    .winner .val span { font-size: .66rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
    .runners { display: grid; }
    .runner { display: flex; align-items: center; gap: 10px; padding: 8px 4px; font-size: .88rem; border-top: 1px solid var(--line); }
    .runner .rk { width: 16px; color: var(--faint); font-weight: 800; font-variant-numeric: tabular-nums; }
    .runner small { color: var(--muted); font-size: .72rem; margin-left: 4px; }
    .runner b { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
    .leaders { width: 100%; border-collapse: collapse; font-size: .86rem; font-variant-numeric: tabular-nums; }
    .leaders th { font-size: .66rem; color: var(--muted); letter-spacing: .5px; text-align: right; padding: 6px; font-weight: 800; }
    .leaders th:nth-child(2), .leaders td:nth-child(2) { text-align: left; }
    .leaders td { padding: 9px 6px; border-top: 1px solid var(--line); text-align: right; }
    .leaders td:nth-child(2) { font-weight: 700; }
    .leaders td:nth-child(2) > div { display: flex; align-items: center; gap: 8px; min-width: 0; }
    @media (max-width: 600px) { .leaders .wide { display: none; } }
  </style>
  <script type="module" src="js/awards.js"></script>
  <script type="module" src="js/admin.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><img src="assets/league/logo.png" alt="" onerror="this.remove()"><span><b><span class="long">Heineken C League</span><span class="short">HCL</span></b><small>Season 3</small></span></a>
      <nav class="nav" aria-label="Site">
        <a href="index.html">Matches</a>
        <a href="index.html#table">Table</a>
        <a href="awards.html" aria-current="page">Awards</a>
      </nav>
    </div>
  </header>
  <div class="app">
    <header class="page-head">
      <p class="eyebrow gold">Season 3 honours</p>
      <h1>League awards</h1>
      <p>Updated automatically after every full-time whistle.</p>
    </header>
    <div class="awards-grid" id="awards"><div class="loading"><div class="spinner" style="border-top-color:#fbbf24"></div>Calculating award winners…</div></div>
    <section class="card">
      <h2 class="card-title">Season leaders</h2>
      <div style="overflow-x:auto">
        <table class="leaders">
          <thead><tr><th>#</th><th>Player</th><th>Apps</th><th>Goals</th><th>Assists</th><th class="wide">Shots</th><th class="wide">xG</th><th class="wide">MOTM</th><th>Rating</th></tr></thead>
          <tbody id="leaders"></tbody>
        </table>
      </div>
    </section>
    <footer class="site-footer"><span>Heineken C League · Season 3</span></footer>
  </div>
</body>
</html>

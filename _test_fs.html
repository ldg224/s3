<script type="module">
const sleep=ms=>new Promise(r=>setTimeout(r,ms)); const $=s=>document.querySelector(s); const log=(...a)=>console.log('T: '+a.join(' '));
(async()=>{
  for(let i=0;i<300&&!(document.querySelector('#mp-full')&&document.querySelector('#mp-msg')?.hidden);i++) await sleep(100);
  log('player ready', !!$('#mp-full'), 'msg hidden', $('#mp-msg')?.hidden);
  $('#mp-full').click(); await sleep(300);
  const scr=$('#mp-screen'), cv=$('#mp-canvas').getBoundingClientRect(), ct=$('.mp-controls').getBoundingClientRect();
  log('fs class', scr.classList.contains('mp-fs'), 'native', !!document.fullscreenElement, 'screen', innerWidth+'x'+innerHeight, 'canvas box', Math.round(cv.width)+'x'+Math.round(cv.height), 'controls bottom', Math.round(ct.bottom), 'btn', $('#mp-full').textContent, 'canvas px', $('#mp-canvas').width);
  if(location.hash==='#idle'){ $('#mp-play').click(); await sleep(3600); log('idle while playing', scr.classList.contains('mp-idle'), 'controls opacity', getComputedStyle($('.mp-controls')).opacity);
    $('#mp-stage').dispatchEvent(new PointerEvent('pointerdown',{bubbles:true})); $('#mp-canvas').click(); await sleep(100);
    log('first tap woke only: idle', scr.classList.contains('mp-idle'), 'still playing', $('#mp-play').textContent);
    return; }
  if(location.hash==='#anc'){ let e=scr.parentElement; while(e){ const c=getComputedStyle(e); if(c.transform!=='none'||c.filter!=='none'||c.backdropFilter!=='none'||c.contain!=='none'||c.willChange!=='auto'||c.contain.includes('paint')) log('ANC', e.tagName+'.'+e.className, 'tf',c.transform,'bf',c.backdropFilter,'filt',c.filter,'contain',c.contain,'wc',c.willChange); e=e.parentElement; } const sr=scr.getBoundingClientRect(); log('screen rect', Math.round(sr.top), Math.round(sr.height)); return; }
  if(location.hash==='#exit'){ document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'})); await sleep(200); log('after Esc fs', scr.classList.contains('mp-fs'), 'btn', $('#mp-full').textContent); }
})();
</script>
